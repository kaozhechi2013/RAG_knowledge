<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge AI - 现代化聊天助手</title>
    <!-- Markdown & Code Highlight -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <!-- KaTeX Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .new-chat-btn {
            padding: 10px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .new-chat-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .session-item:hover {
            background: var(--bg-tertiary);
        }

        .session-item.active {
            background: var(--primary-color);
            color: white;
        }

        .session-title {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-delete {
            opacity: 0;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .session-item:hover .session-delete {
            opacity: 1;
        }

        .session-delete:hover {
            background: #ef4444;
            color: white;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary-color);
        }

        .status-badge {
            padding: 4px 12px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.offline {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Chat Messages */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .message-group {
            max-width: 900px;
            margin: 0 auto 24px;
            animation: messageSlideIn 0.3s ease;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            background: var(--primary-color);
            color: white;
        }

        .avatar.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .avatar.assistant {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .message-time {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .message-content {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .message-group.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        /* Markdown Styles */
        .markdown-body {
            line-height: 1.7;
            font-size: 15px;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .markdown-body h1 {
            font-size: 1.8em;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .markdown-body h2 {
            font-size: 1.5em;
        }

        .markdown-body h3 {
            font-size: 1.25em;
        }

        .markdown-body p {
            margin-bottom: 16px;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 2em;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }

        .markdown-body pre {
            background: #282c34;
            border-radius: var(--radius-sm);
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .markdown-body code {
            background: rgba(135, 131, 120, 0.15);
            color: #eb5757;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        .markdown-body pre code {
            background: transparent;
            color: #abb2bf;
            padding: 0;
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 16px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-style: italic;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .markdown-body th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        .markdown-body a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        /* User message markdown (white text) */
        .message-group.user .markdown-body,
        .message-group.user .markdown-body h1,
        .message-group.user .markdown-body h2,
        .message-group.user .markdown-body h3,
        .message-group.user .markdown-body p,
        .message-group.user .markdown-body li {
            color: white;
        }

        .message-group.user .markdown-body code {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Citations */
        .citation {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            font-size: 0.7em;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            cursor: pointer;
            vertical-align: super;
            transition: all 0.2s;
        }

        .citation:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .citations-panel {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .citations-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .citation-item {
            padding: 12px;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .citation-item:hover {
            border-color: var(--primary-color);
            transform: translateX(4px);
        }

        .citation-item-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .citation-number {
            width: 24px;
            height: 24px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .citation-item-title {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .citation-score {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .citation-preview {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Input Area */
        .input-area {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 20px 24px;
        }

        .input-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .kb-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .kb-selector label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .kb-selector select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .kb-selector select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Document List Dropdown */
        .doc-list-wrapper {
            position: relative;
            flex: 1;
            display: none;  /* 默认隐藏 */
        }

        .doc-list-trigger {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            user-select: none;
        }

        .doc-list-trigger:hover {
            border-color: var(--primary-color);
            background: var(--bg-tertiary);
        }

        .doc-list-trigger.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .doc-list-trigger-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-list-arrow {
            font-size: 12px;
            color: var(--text-tertiary);
            transition: transform 0.2s;
        }

        .doc-list-arrow.open {
            transform: rotate(180deg);
        }

        .doc-list-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .doc-list-dropdown.show {
            display: block;
            animation: dropdownSlideIn 0.2s ease;
        }

        @keyframes dropdownSlideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .doc-item {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            cursor: default;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-item:last-child {
            border-bottom: none;
        }

        .doc-item:hover {
            background: var(--bg-tertiary);
        }

        .doc-icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .doc-info {
            flex: 1;
            min-width: 0;
        }

        .doc-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-meta {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .doc-list-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            position: relative;
        }

        .input-box textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 200px;
            transition: all 0.2s;
        }

        .input-box textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            padding: 14px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .btn-primary {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            padding: 10px 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        /* Loading Animation */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100vh;
            }

            .chat-header {
                padding: 12px 16px;
            }

            .chat-container {
                padding: 16px;
            }

            .input-area {
                padding: 16px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .empty-state-text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">💬 对话历史</div>
            </div>
            <div style="padding: 16px;">
                <button class="new-chat-btn" onclick="createNewSession()">
                    <span>✨</span>
                    <span>新建对话</span>
                </button>
            </div>
            <div class="sessions-list" id="sessionsList">
                <!-- Sessions will be added here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="icon-btn" onclick="toggleSidebar()">☰</button>
                    <div class="chat-title">Knowledge AI 助手</div>
                </div>
                <div class="header-actions">
                    <div class="status-badge" id="statusBadge">未连接</div>
                    <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
                    <button class="icon-btn" onclick="clearCurrentChat()" title="清空当前对话">🗑️</button>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container" id="chatContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-title">开始新的对话</div>
                    <div class="empty-state-text">选择知识库或直接提问</div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <div class="kb-selector">
                        <label>📚 知识库:</label>
                        <select id="knowledgeBaseSelect" onchange="onKnowledgeBaseChange()">
                            <option value="">💬 普通对话</option>
                        </select>
                        <!-- 文档列表下拉框 -->
                        <div class="doc-list-wrapper" id="docListWrapper">
                            <div class="doc-list-trigger" id="docListTrigger" onclick="toggleDocList(event)">
                                <span class="doc-list-trigger-text" id="docListTriggerText">📄 查看文档</span>
                                <span class="doc-list-arrow" id="docListArrow">▼</span>
                            </div>
                            <div class="doc-list-dropdown" id="docListDropdown">
                                <div id="docListItems"></div>
                            </div>
                        </div>
                        <button class="icon-btn" onclick="refreshKnowledgeBases()" title="刷新知识库">🔄</button>
                    </div>
                    <div class="input-wrapper">
                        <div class="input-box">
                            <textarea 
                                id="messageInput" 
                                placeholder="输入消息... (Shift + Enter 换行)"
                                rows="1"
                                onkeydown="handleInputKeydown(event)"
                                oninput="autoResizeTextarea(this)"
                            ></textarea>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <span>发送</span>
                            <span>➤</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ 设置</div>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">API 地址</label>
                    <input type="text" class="form-input" id="apiUrlInput" placeholder="http://localhost:23333">
                    <div class="form-hint">
                        <div>💡 <strong>推荐配置：</strong>使用启动脚本显示的局域网地址</div>
                        <div style="margin-top: 4px;">例如: <code>http://10.216.186.24:23333</code></div>
                        <div style="margin-top: 4px; color: #94a3b8;">本机测试可用 localhost，但可能影响知识库功能</div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">选择模型</label>
                    <select class="form-select" id="modelSelect">
                        <option value="">加载中...</option>
                    </select>
                    <button class="btn-secondary" style="margin-top: 8px;" onclick="refreshModels()">🔄 刷新模型列表</button>
                </div>
                <div class="form-group">
                    <label class="form-label">知识库</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select class="form-select" id="knowledgeBaseSelectInSettings" disabled style="flex: 1;">
                            <option value="">查看主界面</option>
                        </select>
                        <button class="btn-secondary" onclick="refreshKnowledgeBases()">🔄 刷新知识库</button>
                    </div>
                    <div class="form-hint">在主界面左下角选择知识库进行对话</div>
                </div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="saveSettings()">保存设置</button>
                    <button class="btn-secondary" onclick="testConnection()">测试连接</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 配置管理 ==========
        let config = {
            apiUrl: '',
            apiKey: '',
            model: '',
            assistantId: '',
            knowledgeBases: []
        };

        let sessions = [];
        let currentSessionId = null;

        // 初始化
        async function init() {
            // 检查是否通过 localhost 访问，显示提示
            checkAccessMethod();
            
            loadConfig();
            loadSessions();
            await fetchApiKey(); // 先获取API Key
            
            // 延迟100ms确保API Key已设置
            await new Promise(resolve => setTimeout(resolve, 100));
            
            // 然后再进行需要API Key的操作
            console.log('🚀 开始初始化服务...');
            updateStatus();
            
            // 并行刷新模型和知识库
            await Promise.all([
                refreshModels(),
                refreshKnowledgeBases()
            ]);
            
            console.log('✅ 初始化完成');
            
            if (sessions.length === 0) {
                createNewSession();
            } else {
                switchSession(sessions[0].id);
            }
        }
        
        // 检查访问方式并显示提示
        function checkAccessMethod() {
            const hostname = window.location.hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                console.warn('⚠️ 您正在通过 localhost 访问 Web 客户端');
                console.warn('⚠️ 建议使用启动脚本显示的局域网地址访问，以获得最佳体验');
                console.warn('⚠️ 例如: http://10.216.186.24:8081');
                
                // 在控制台显示明显的提示
                console.log('%c💡 使用提示', 'background: #fbbf24; color: #000; padding: 8px; font-size: 14px; font-weight: bold;');
                console.log('%c如果知识库刷新失败，请尝试:', 'font-size: 12px; color: #64748b;');
                console.log('%c1. 使用启动脚本显示的 IP 地址访问（推荐）', 'font-size: 12px; color: #0f172a;');
                console.log('%c2. 在设置中手动填写 API 服务器 IP 地址', 'font-size: 12px; color: #0f172a;');
            }
        }

        // 智能API地址检测 - 优先使用局域网IP
        function getDefaultApiUrl() {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            
            // 如果通过 localhost 或 127.0.0.1 访问，尝试获取服务器的真实IP
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                // 提示用户应该使用服务器IP访问
                console.warn('⚠️ 检测到通过 localhost 访问，建议使用服务器 IP 地址访问以获得最佳体验');
                console.warn('⚠️ 启动脚本会显示正确的访问地址，格式如: http://10.216.186.24:8081');
            }
            
            // 自动使用当前访问的主机地址
            // 无论是localhost、局域网IP还是域名都能自动适配
            return `${protocol}//${hostname}:23333`;
        }

        // 加载配置
        function loadConfig() {
            const savedApiUrl = localStorage.getItem('apiUrl');
            const currentHostname = window.location.hostname;
            const defaultUrl = getDefaultApiUrl();
            
            // 智能地址管理逻辑：
            // 1. 如果首次使用（无保存地址），使用检测到的地址
            // 2. 如果保存的地址是 localhost，但当前通过IP访问，更新为IP地址
            // 3. 如果保存的地址是 IP，但当前通过localhost访问，保持IP地址（不降级）
            if (!savedApiUrl) {
                // 首次使用
                config.apiUrl = defaultUrl;
                localStorage.setItem('apiUrl', defaultUrl);
                console.log('🎯 首次启动，API地址设为:', config.apiUrl);
            } else if (savedApiUrl.includes('localhost') && !currentHostname.includes('localhost') && currentHostname !== '127.0.0.1') {
                // 之前用 localhost，现在用 IP 访问，升级为 IP
                config.apiUrl = defaultUrl;
                localStorage.setItem('apiUrl', defaultUrl);
                console.log('🔄 从 localhost 升级到 IP 地址:', config.apiUrl);
            } else {
                // 使用保存的地址
                config.apiUrl = savedApiUrl;
                console.log('✅ 使用已保存的 API 地址:', config.apiUrl);
            }
            
            // 默认使用千问3 8B模型
            config.model = localStorage.getItem('model') || 'Qwen/Qwen2.5-Coder-32B-Instruct';
            config.assistantId = localStorage.getItem('assistantId') || '';
            
            try {
                config.knowledgeBases = JSON.parse(localStorage.getItem('knowledgeBases') || '[]');
            } catch (e) {
                config.knowledgeBases = [];
            }
            
            document.getElementById('apiUrlInput').value = config.apiUrl;
            
            console.log('🔧 配置加载完成:', {
                apiUrl: config.apiUrl,
                model: config.model,
                autoDetected: !savedApiUrl || savedApiUrl !== config.apiUrl
            });
        }

        // 保存配置
        function saveConfig() {
            localStorage.setItem('apiUrl', config.apiUrl);
            localStorage.setItem('model', config.model);
            localStorage.setItem('assistantId', config.assistantId);
            localStorage.setItem('knowledgeBases', JSON.stringify(config.knowledgeBases));
        }

        // 获取API Key (使用固定的API Key)
        async function fetchApiKey() {
            // 使用固定的内部API Key
            config.apiKey = 'sk-knowledge-internal-2024';
            console.log('✅ API Key已设置');
        }

        // ========== 会话管理 ==========
        function loadSessions() {
            try {
                sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
            } catch (e) {
                sessions = [];
            }
            renderSessions();
        }

        function saveSessions() {
            localStorage.setItem('sessions', JSON.stringify(sessions));
        }

        function createNewSession() {
            const session = {
                id: Date.now().toString(),
                title: '新对话',
                messages: [],
                createdAt: Date.now()
            };
            sessions.unshift(session);
            saveSessions();
            switchSession(session.id);
            renderSessions();
        }

        function deleteSession(sessionId) {
            if (!confirm('确定删除这个对话吗?')) return;
            
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions();
            
            if (currentSessionId === sessionId) {
                if (sessions.length > 0) {
                    switchSession(sessions[0].id);
                } else {
                    createNewSession();
                }
            }
            
            renderSessions();
        }

        function switchSession(sessionId) {
            currentSessionId = sessionId;
            renderMessages();
            renderSessions();
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        function renderSessions() {
            const list = document.getElementById('sessionsList');
            list.innerHTML = sessions.map(session => `
                <div class="session-item ${session.id === currentSessionId ? 'active' : ''}" 
                     onclick="switchSession('${session.id}')">
                    <div class="session-title">${session.title}</div>
                    <button class="session-delete" onclick="event.stopPropagation(); deleteSession('${session.id}')">删除</button>
                </div>
            `).join('');
        }

        // ========== 消息渲染 ==========
        function renderMessages() {
            const container = document.getElementById('chatContainer');
            const session = getCurrentSession();
            
            if (!session || session.messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-title">开始新的对话</div>
                        <div class="empty-state-text">选择知识库或直接提问</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = session.messages.map(msg => {
                const isUser = msg.role === 'user';
                return `
                    <div class="message-group ${isUser ? 'user' : 'assistant'}">
                        <div class="message-header">
                            <div class="avatar ${isUser ? 'user' : 'assistant'}">${isUser ? '👤' : '🤖'}</div>
                            <div class="message-name">${isUser ? '你' : 'AI助手'}</div>
                            <div class="message-time">${formatTime(msg.timestamp)}</div>
                        </div>
                        <div class="message-content">
                            <div class="markdown-body">${renderMarkdown(msg.content)}</div>
                            ${msg.citations ? renderCitations(msg.citations) : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            scrollToBottom();
        }

        function renderMarkdown(text) {
            marked.setOptions({
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (err) {}
                    }
                    return hljs.highlightAuto(code).value;
                }
            });
            
            let html = marked.parse(text);
            
            // 处理引用标注 [cite:1] -> <span class="citation">1</span>
            html = html.replace(/\[(?:cite:)?(\d+)\]/g, '<span class="citation" onclick="scrollToCitation($1)">$1</span>');
            
            return html;
        }

        function renderCitations(citations) {
            if (!citations || citations.length === 0) return '';
            
            // 过滤相似度低于50%的引用
            const filtered = citations.filter(c => !c.score || c.score >= 0.5);
            if (filtered.length === 0) return '';
            
            return `
                <div class="citations-panel">
                    <div class="citations-title">
                        <span>📚</span>
                        <span>引用来源 (${filtered.length})</span>
                    </div>
                    ${filtered.map((c, i) => `
                        <div class="citation-item" id="citation-${i + 1}">
                            <div class="citation-item-header">
                                <div class="citation-number">${i + 1}</div>
                                <div class="citation-item-title">${c.title || c.url || `引用 ${i + 1}`}</div>
                                ${c.score ? `<div class="citation-score">${(c.score * 100).toFixed(1)}%</div>` : ''}
                            </div>
                            <div class="citation-preview">${c.content || '无预览内容'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function scrollToCitation(num) {
            const el = document.getElementById(`citation-${num}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.borderColor = 'var(--primary-color)';
                setTimeout(() => {
                    el.style.borderColor = 'var(--border-color)';
                }, 2000);
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            
            return date.toLocaleString('zh-CN', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ========== 发送消息 ==========
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();
            
            if (!message) return;
            if (!config.model) {
                alert('请先在设置中选择模型');
                openSettings();
                return;
            }
            
            const session = getCurrentSession();
            if (!session) {
                createNewSession();
                return sendMessage();
            }
            
            // 禁用输入
            input.disabled = true;
            sendBtn.disabled = true;
            
            // 添加用户消息
            const userMessage = {
                role: 'user',
                content: message,
                timestamp: Date.now()
            };
            session.messages.push(userMessage);
            
            // 更新标题
            if (session.messages.length === 1) {
                session.title = message.substring(0, 30) + (message.length > 30 ? '...' : '');
            }
            
            saveSessions();
            input.value = '';
            renderMessages();
            renderSessions();
            
            // 添加加载消息
            const loadingMsg = {
                role: 'assistant',
                content: '',
                timestamp: Date.now(),
                isStreaming: true
            };
            session.messages.push(loadingMsg);
            renderMessages();
            
            // 显示加载动画
            const container = document.getElementById('chatContainer');
            const lastMessage = container.lastElementChild;
            const contentDiv = lastMessage.querySelector('.markdown-body');
            contentDiv.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            
            try {
                // 构建请求
                const requestBody = {
                    model: config.model,
                    messages: session.messages.filter(m => !m.isStreaming).map(m => ({
                        role: m.role,
                        content: m.content
                    })),
                    stream: true
                };
                
                if (config.assistantId) {
                    requestBody.assistant_id = config.assistantId;
                }
                
                // 如果使用知识库,实时获取完整数据（包含items信息）
                if (config.knowledgeBases && config.knowledgeBases.length > 0) {
                    try {
                        const kbResponse = await fetch(`${config.apiUrl}/v1/knowledge`, {
                            headers: { 'Authorization': `Bearer ${config.apiKey}` }
                        });
                        if (kbResponse.ok) {
                            const kbResult = await kbResponse.json();
                            const allKbs = kbResult.data || [];
                            // 只包含选中的知识库,并确保包含完整items数据
                            requestBody.knowledge_bases = allKbs.filter(kb => 
                                config.knowledgeBases.some(selected => selected.id === kb.id)
                            );
                            console.log('📚 Using knowledge bases:', requestBody.knowledge_bases.map(kb => ({
                                id: kb.id,
                                name: kb.name,
                                itemCount: kb.items?.length || 0
                            })));
                        } else {
                            // 降级到使用存储的数据
                            requestBody.knowledge_bases = config.knowledgeBases;
                        }
                    } catch (e) {
                        console.warn('Failed to fetch fresh KB data, using cached:', e);
                        requestBody.knowledge_bases = config.knowledgeBases;
                    }
                }
                
                // 发送请求
                const response = await fetch(`${config.apiUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.apiKey}`
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                // 处理流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let citations = null;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (!line.trim() || line.trim() === 'data: [DONE]') continue;
                        if (!line.startsWith('data: ')) continue;
                        
                        try {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.choices && data.choices[0]?.delta?.content) {
                                fullContent += data.choices[0].delta.content;
                                loadingMsg.content = fullContent;
                                contentDiv.innerHTML = renderMarkdown(fullContent);
                                scrollToBottom();
                            }
                            
                            if (data.choices && data.choices[0]?.message?.citations) {
                                citations = data.choices[0].message.citations.filter(c => !c.score || c.score >= 0.5);
                            }
                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }
                
                // 完成
                loadingMsg.isStreaming = false;
                loadingMsg.citations = citations;
                saveSessions();
                renderMessages();
                
            } catch (error) {
                console.error('发送消息失败:', error);
                session.messages.pop();
                session.messages.push({
                    role: 'assistant',
                    content: `❌ 发送失败: ${error.message}`,
                    timestamp: Date.now()
                });
                saveSessions();
                renderMessages();
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                autoResizeTextarea(input);
            }
        }

        // ========== 知识库管理 ==========
        async function refreshKnowledgeBases() {
            console.log('🔄 开始刷新知识库...');
            const select = document.getElementById('knowledgeBaseSelect');
            select.innerHTML = '<option value="">加载中...</option>';
            
            // 确保 API Key 已设置
            if (!config.apiKey) {
                console.warn('⚠️ API Key 未设置，等待初始化...');
                await fetchApiKey();
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            try {
                // 检查配置
                console.log('📡 API URL:', config.apiUrl);
                console.log('🔑 API Key:', config.apiKey ? '已设置' : '未设置');
                
                const url = `${config.apiUrl}/v1/knowledge`;
                console.log('📍 请求地址:', url);
                
                const response = await fetch(url, {
                    headers: { 
                        'Authorization': `Bearer ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📥 响应状态:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ 错误响应:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                console.log('📦 知识库数据:', result);
                
                const kbs = result.data || [];
                console.log(`✅ 成功加载 ${kbs.length} 个知识库`);
                
                select.innerHTML = '<option value="">💬 普通对话</option>';
                kbs.forEach(kb => {
                    console.log(`  - ${kb.name} (${kb.documentCount || 0}个文档)`);
                    const option = document.createElement('option');
                    option.value = kb.id;
                    option.textContent = `📚 ${kb.name} (${kb.documentCount || 0}个文档)`;
                    option.dataset.kb = JSON.stringify(kb);
                    select.appendChild(option);
                });
                
                console.log(`📋 下拉框已更新，共 ${select.options.length} 个选项`);
                
                // 恢复选择并触发显示文档列表
                if (config.knowledgeBases && config.knowledgeBases.length > 0) {
                    const savedKbId = config.knowledgeBases[0].id;
                    console.log(`🔄 尝试恢复之前选择的知识库: ${savedKbId}`);
                    select.value = savedKbId;
                    
                    // 手动触发显示文档列表
                    const selectedOption = select.options[select.selectedIndex];
                    if (selectedOption && selectedOption.value && selectedOption.dataset && selectedOption.dataset.kb) {
                        try {
                            const kb = JSON.parse(selectedOption.dataset.kb);
                            console.log(`✅ 恢复知识库选择: ${kb.name}`);
                            showDocumentList(kb);
                        } catch (e) {
                            console.error('❌ 解析知识库数据失败:', e);
                        }
                    } else {
                        console.warn('⚠️ 未找到之前选择的知识库，已重置');
                        hideDocumentList();
                    }
                } else {
                    console.log('ℹ️ 无之前保存的知识库选择');
                    hideDocumentList();
                }
            } catch (error) {
                console.error('❌ 加载知识库失败:', error);
                console.error('错误详情:', error.message);
                
                // 如果是网络错误，提供更友好的提示
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    select.innerHTML = '<option value="">⚠️ 无法连接到服务器</option>';
                    console.error('💡 请检查:');
                    console.error('  1. API 服务器是否已启动（在桌面应用设置中启用）');
                    console.error('  2. API 地址是否正确:', config.apiUrl);
                    console.error('  3. 防火墙是否允许访问端口 23333');
                } else {
                    select.innerHTML = '<option value="">❌ 加载失败</option>';
                }
                hideDocumentList();
            }
        }

        function onKnowledgeBaseChange() {
            const select = document.getElementById('knowledgeBaseSelect');
            const selectedOption = select.options[select.selectedIndex];
            
            console.log('📝 知识库选择改变:', {
                selectedIndex: select.selectedIndex,
                value: select.value,
                hasDataset: selectedOption && !!selectedOption.dataset
            });
            
            if (selectedOption && selectedOption.dataset && selectedOption.dataset.kb) {
                try {
                    const kb = JSON.parse(selectedOption.dataset.kb);
                    // 保存完整的知识库数据（包含items）
                    config.knowledgeBases = [kb];
                    console.log('📚 已选择知识库:', {
                        id: kb.id,
                        name: kb.name,
                        itemCount: kb.items?.length || 0
                    });
                    // 显示文档列表
                    showDocumentList(kb);
                } catch (e) {
                    console.error('❌ 解析知识库数据失败:', e);
                    config.knowledgeBases = [];
                    hideDocumentList();
                }
            } else {
                console.log('ℹ️ 切换到普通对话模式');
                config.knowledgeBases = [];
                hideDocumentList();
            }
            
            saveConfig();
        }

        // ========== 文档列表管理 ==========
        function showDocumentList(kb) {
            const wrapper = document.getElementById('docListWrapper');
            const triggerText = document.getElementById('docListTriggerText');
            const itemsContainer = document.getElementById('docListItems');
            
            // 获取文档列表
            const docs = kb.items?.filter(item => item.type === 'file' && item.content) || [];
            
            console.log('📄 显示文档列表:', {
                kbName: kb.name,
                totalItems: kb.items?.length || 0,
                fileItems: docs.length,
                items: docs.map(d => d.content?.origin_name || d.content?.name)
            });
            
            // 更新触发按钮文本
            triggerText.textContent = `📄 查看文档 (${docs.length})`;
            
            // 显示文档列表容器
            wrapper.style.display = 'block';
            
            // 渲染文档列表
            if (docs.length === 0) {
                itemsContainer.innerHTML = '<div class="doc-list-empty">该知识库暂无文档</div>';
            } else {
                itemsContainer.innerHTML = docs.map(item => {
                    const doc = item.content;
                    const icon = getDocIcon(doc.ext || '');
                    const name = doc.origin_name || doc.name || '未知文档';
                    const ext = (doc.ext || '').toUpperCase();
                    
                    return `
                        <div class="doc-item" title="${name}">
                            <div class="doc-icon">${icon}</div>
                            <div class="doc-info">
                                <div class="doc-name">${name}</div>
                                <div class="doc-meta">${ext ? ext + ' 文件' : '文档'}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function hideDocumentList() {
            const wrapper = document.getElementById('docListWrapper');
            const dropdown = document.getElementById('docListDropdown');
            const trigger = document.getElementById('docListTrigger');
            const arrow = document.getElementById('docListArrow');
            
            // 隐藏容器
            wrapper.style.display = 'none';
            
            // 关闭下拉菜单
            dropdown.classList.remove('show');
            trigger.classList.remove('active');
            arrow.classList.remove('open');
        }

        function toggleDocList(event) {
            event.stopPropagation();
            
            const dropdown = document.getElementById('docListDropdown');
            const trigger = document.getElementById('docListTrigger');
            const arrow = document.getElementById('docListArrow');
            
            const isOpen = dropdown.classList.contains('show');
            
            if (isOpen) {
                dropdown.classList.remove('show');
                trigger.classList.remove('active');
                arrow.classList.remove('open');
            } else {
                dropdown.classList.add('show');
                trigger.classList.add('active');
                arrow.classList.add('open');
            }
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(event) {
            const wrapper = document.getElementById('docListWrapper');
            const dropdown = document.getElementById('docListDropdown');
            const trigger = document.getElementById('docListTrigger');
            const arrow = document.getElementById('docListArrow');
            
            if (wrapper && !wrapper.contains(event.target)) {
                dropdown.classList.remove('show');
                trigger.classList.remove('active');
                arrow.classList.remove('open');
            }
        });

        function getDocIcon(ext) {
            const extLower = ext.toLowerCase();
            const iconMap = {
                'pdf': '📕',
                'doc': '📘',
                'docx': '📘',
                'txt': '📄',
                'md': '📝',
                'xls': '📊',
                'xlsx': '📊',
                'csv': '📊',
                'ppt': '📙',
                'pptx': '📙',
                'jpg': '🖼️',
                'jpeg': '🖼️',
                'png': '🖼️',
                'gif': '🖼️',
                'html': '🌐',
                'htm': '🌐',
                'json': '📋',
                'xml': '📋',
                'zip': '📦',
                'rar': '📦',
                '7z': '📦'
            };
            
            return iconMap[extLower] || '📄';
        }

        // ========== UI交互 ==========
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function clearCurrentChat() {
            const session = getCurrentSession();
            if (!session) return;
            
            if (!confirm('确定清空当前对话吗?')) return;
            
            session.messages = [];
            saveSessions();
            renderMessages();
        }

        async function openSettings() {
            console.log('⚙️ 打开设置对话框');
            
            // 填充当前配置到输入框
            document.getElementById('apiUrlInput').value = config.apiUrl || getDefaultApiUrl();
            
            document.getElementById('settingsModal').classList.add('show');
            
            // 并行刷新模型和知识库
            console.log('🔄 开始刷新模型和知识库...');
            await Promise.all([
                refreshModels(),
                refreshKnowledgeBases()
            ]);
            console.log('✅ 刷新完成');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function saveSettings() {
            config.apiUrl = document.getElementById('apiUrlInput').value.trim();
            config.model = document.getElementById('modelSelect').value;
            
            saveConfig();
            fetchApiKey();
            updateStatus();
            closeSettings();
            
            alert('设置已保存');
        }

        async function testConnection() {
            const apiUrl = document.getElementById('apiUrlInput').value.trim();
            if (!apiUrl) {
                alert('请输入API地址');
                return;
            }
            
            try {
                const response = await fetch(`${apiUrl}/v1/models`, {
                    headers: { 'Authorization': `Bearer ${config.apiKey}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    alert(`✅ 连接成功!\n找到 ${data.data?.length || 0} 个模型`);
                } else {
                    alert(`❌ 连接失败\nHTTP ${response.status}`);
                }
            } catch (error) {
                alert(`❌ 连接失败\n${error.message}`);
            }
        }

        async function refreshModels() {
            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option value="">加载中...</option>';
            
            // 确保 API Key 已设置
            if (!config.apiKey) {
                console.warn('⚠️ API Key 未设置，等待初始化...');
                await fetchApiKey();
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            try {
                console.log('🔄 刷新模型列表...');
                console.log('📡 API URL:', config.apiUrl);
                
                const response = await fetch(`${config.apiUrl}/v1/models`, {
                    headers: { 
                        'Authorization': `Bearer ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ 获取模型失败:', errorText);
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const models = data.data || [];
                
                console.log(`✅ 获取到 ${models.length} 个模型`);
                
                if (models.length === 0) {
                    select.innerHTML = '<option value="">未找到模型</option>';
                    return;
                }
                
                select.innerHTML = '';
                
                // 优先级模型列表（按顺序尝试，兼容 ollama 格式）
                const preferredModels = [
                    'ollama:qwen3:8b',         // Ollama 千问3 8B
                    'qwen3:8b',                // 千问3 8B
                    'qwen3',                   // 任何千问3模型
                    'ollama:qwen',             // Ollama 千问系列
                    'qwen',                    // 任何千问模型
                    'Qwen2.5-Coder-32B'        // 千问编码器
                ];
                
                let defaultModel = null;
                
                // 查找首选模型
                if (!config.model || config.model === 'deepseek-chat') {
                    for (const preferred of preferredModels) {
                        const found = models.find(m => 
                            m.id.toLowerCase().includes(preferred.toLowerCase())
                        );
                        if (found) {
                            defaultModel = found.id;
                            console.log(`✅ 自动选择模型: ${defaultModel} (匹配: ${preferred})`);
                            break;
                        }
                    }
                    // 如果没找到首选模型，使用第一个
                    if (!defaultModel && models.length > 0) {
                        defaultModel = models[0].id;
                        console.log(`ℹ️ 使用第一个模型: ${defaultModel}`);
                    }
                }
                
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = `${model.id} (${model.owned_by || 'unknown'})`;
                    
                    // 选择逻辑：已保存的配置 > 默认模型 > 第一个
                    if (config.model && model.id === config.model) {
                        option.selected = true;
                    } else if (!config.model && defaultModel && model.id === defaultModel) {
                        option.selected = true;
                        config.model = defaultModel;
                        saveConfig();
                    }
                    
                    select.appendChild(option);
                });
                
                console.log('📋 模型列表加载完成:', {
                    total: models.length,
                    selected: config.model,
                    wasAutoSelected: !!defaultModel
                });
                
            } catch (error) {
                console.error('加载模型失败:', error);
                select.innerHTML = '<option value="">❌ 加载失败</option>';
            }
        }

        async function updateStatus() {
            const badge = document.getElementById('statusBadge');
            
            try {
                const response = await fetch(`${config.apiUrl}/v1/models`, {
                    headers: { 'Authorization': `Bearer ${config.apiKey}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const count = data.data?.length || 0;
                    badge.textContent = count > 0 ? `✅ 已连接 (${count})` : '⚠️ 无模型';
                    badge.className = count > 0 ? 'status-badge' : 'status-badge offline';
                } else {
                    badge.textContent = '❌ 连接失败';
                    badge.className = 'status-badge offline';
                }
            } catch (error) {
                badge.textContent = '❌ 未连接';
                badge.className = 'status-badge offline';
            }
        }

        // ========== 输入框辅助 ==========
        function handleInputKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // 定时更新状态
        setInterval(updateStatus, 30000);

        // 初始化应用
        init();
    </script>
</body>
</html>
